# Payment API: gRPC ingestion for payments, with Redis fast-path idempotency.
#
# Probes use the gRPC health checking protocol the service already registers, rather than a
# TCP socket check. A socket check passes as soon as the port is bound, which would report
# a pod healthy while it is still failing to reach PostgreSQL -- exactly the failure this
# platform exists to detect.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: resilientbank
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: resilientbank
    app.kubernetes.io/component: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/part-of: resilientbank
    spec:
      # The distroless image has no shell, so the migration Job cannot use one.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: payments-api
          image: resilientbank:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/payments-api"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 2112
          envFrom:
            - configMapRef:
                name: resilientbank-config
          # Bound the blast radius of a stuck container. TerminationGracePeriodSeconds is
          # deliberately longer than the server's own 10s gRPC drain so an in-flight
          # CreatePayment completes rather than being cut off mid-transaction.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            grpc:
              port: 50051
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: resilientbank
  labels:
    app.kubernetes.io/name: payments-api
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
# Metrics are scraped by Prometheus in a later phase. Exposed as a separate service so the
# gRPC surface is never used for operational traffic.
apiVersion: v1
kind: Service
metadata:
  name: payments-api-metrics
  namespace: resilientbank
  labels:
    app.kubernetes.io/name: payments-api
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: metrics
      port: 2112
      targetPort: metrics