apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base workload set for one region. The region overlays set the namespace so the same
# manifests can be deployed to Region A and Region B without keeping two copies in sync.
resources:
  - dependencies.yaml
  - migrate-job.yaml
  - outbox-relayer.yaml
  - payments-api.yaml
