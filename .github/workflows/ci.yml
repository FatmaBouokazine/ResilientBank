name: CI

# The repository's default branch is feat/phase1-payments-api, not main. Override by
# setting a DEFAULT_BRANCH repository variable when the default branch is renamed, so
# these references do not have to be edited in lockstep with the branch name.
env:
  DEFAULT_BRANCH: ${{ vars.DEFAULT_BRANCH || 'feat/phase1-payments-api' }}

on:
  push:
    branches: ["${{ vars.DEFAULT_BRANCH || 'feat/phase1-payments-api' }}"]
  pull_request:

jobs:
  payments-api:
    name: Payments API (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/payments-api/go.mod

      # The committed toolchain pins are the contract for generated code. Verifying them
      # here means a wrong local install is caught before it can produce a diff.
      - name: Verify pinned toolchain
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Verify vet and build
        working-directory: services/payments-api
        run: |
          go vet ./...
          go build ./...

      - name: Run unit tests
        working-directory: services/payments-api
        run: go test -v -race ./...

  payments-api-integration:
    name: Payments API (atomicity)
    runs-on: ubuntu-latest

    # The outbox guarantees that a payment and its event commit or roll back together.
    # That behaviour lives in the database's transaction log and cannot be verified by
    # unit tests or by a fake, so it is proven here against a real PostgreSQL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: resilient
          POSTGRES_PASSWORD: resilient
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resilient -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/payments-api/go.mod

# The migrator is the single source of truth for the schema. CI applies it the
      # same way a developer does, so a migration that works locally cannot skip CI.
      - name: Apply database migrations
        working-directory: services/payments-api
        env:
          DATABASE_URL: postgres://resilient:resilient@localhost:5432/payments?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Assert no migrations left pending
        working-directory: services/payments-api
        run: |
          # goose writes its logger output to stderr, so 2>&1 is required. Without it
          # this captures nothing, the grep never matches, and the check silently
          # passes on an unapplied migration.
          status="$(go run ./cmd/migrate status 2>&1)"
          echo "$status"
          # `migrate status` prints a "Pending" row per unapplied migration; the
          # column header reads "Applied At" when everything is applied.
          if echo "$status" | grep -q "Pending"; then
            echo "::error::migrations are still pending after 'migrate up'"
            exit 1
          fi

      - name: Run atomicity integration tests
        working-directory: services/payments-api
        env:
          TEST_DATABASE_URL: postgres://resilient:resilient@localhost:5432/payments?sslmode=disable
        run: go test -v -race -tags=integration ./...

  proto:
    name: Protocol Buffers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # buf breaking resolves the baseline through git, so full history is required.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.50.0

      - name: Lint proto definitions
        run: buf lint

      # NOTE: this only detects breaking changes to protos that already exist on the
      # baseline branch. A brand new file cannot be breaking, so a package introduced by
      # a feature branch is not protected by this gate until it is merged. Once
      # events.v1 lands on the default branch this check becomes meaningful for it.
      - name: Check for breaking proto changes
        run: buf breaking --against ".git#branch=${{ vars.DEFAULT_BRANCH || 'feat/phase1-payments-api' }}"